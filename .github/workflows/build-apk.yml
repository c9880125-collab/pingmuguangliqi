name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Verify Android SDK 37
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          sdkmanager --version
          if [ ! -d "${ANDROID_HOME}/platforms/android-37" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager \
              "platforms;android-37" \
              "platform-tools" \
              "build-tools;37.0.0"
          fi

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew
          ls -l gradlew
          file gradlew

      - name: Test Gradle
        shell: bash
        run: |
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p github-artifact
          APK=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" github-artifact/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: github-artifact/app-debug.apk
          if-no-files-found: error
          retention-days: 14
