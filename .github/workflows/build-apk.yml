name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
  uses: gradle/actions/setup-gradle@v6
  with:
    validate-wrappers: false

      - name: Verify Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          sdkmanager --version
          if [ ! -d "${ANDROID_HOME}/platforms/android-37" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p github-artifact
          APK="$(find composeApp/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" github-artifact/RefreshRateManager-1.2.0-debug.apk
          (cd github-artifact && sha256sum RefreshRateManager-1.2.0-debug.apk > RefreshRateManager-1.2.0-debug.apk.sha256)
          ls -lh github-artifact

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: RefreshRateManager-1.2.0-debug
          path: github-artifact/*
          if-no-files-found: error
          retention-days: 14
